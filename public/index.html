<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Monoprice 10761 Controller</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
      --radius-sm: 0.5rem; --radius-md: 0.75rem; --radius-lg: 1rem; --radius-full: 9999px;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    :root, [data-theme="light"] {
      --bg:#f7f6f2; --surface:#fbfbf9; --surface-alt:#f3f0ec; --border:#d4d1ca; --text:#28251d; --text-muted:#7a7974;
      --accent:#5b5cff; --accent-soft:#dfdcff; --accent-strong:#3f40d6; --warning-bg:#fff2db; --warning-border:#e2b55d; --warning-text:#6d4a00;
      --shadow:0 10px 30px rgba(0,0,0,0.08);
    }
    [data-theme="dark"] {
      --bg:#0b0d18; --surface:#161a2d; --surface-alt:#1d2238; --border:#2c3251; --text:#f3f5ff; --text-muted:#98a1c5;
      --accent:#7c73ff; --accent-soft:#2f3158; --accent-strong:#9088ff; --warning-bg:#3a2e19; --warning-border:#8a6a25; --warning-text:#f3d08b;
      --shadow:0 10px 30px rgba(0,0,0,0.35);
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:linear-gradient(180deg, #11152a 0%, var(--bg) 140px); color:var(--text); min-height:100vh; }
    button,input,select { font:inherit; }
    .app { max-width:1100px; margin:0 auto; padding:1rem; }
    .serial-banner { display:none; margin-bottom:1rem; background:var(--warning-bg); border:1px solid var(--warning-border); color:var(--warning-text); border-radius:var(--radius-md); padding:0.75rem 1rem; }
    .header { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; margin-bottom:1rem; }
    .title { display:flex; align-items:flex-start; gap:0.75rem; font-weight:700; font-size:1.8rem; line-height:1.05; }
    .title-icon { color:#b35cff; }
    .header-actions { display:flex; align-items:center; gap:0.75rem; }
    .pill-btn { border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--text); border-radius:0.9rem; padding:0.8rem 1rem; box-shadow:var(--shadow); }
    .theme-toggle { width:3rem; height:3rem; display:grid; place-items:center; }
    .grid { display:grid; gap:1rem; grid-template-columns:1fr; }
    @media (min-width:700px){ .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (min-width:1040px){ .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    .zone-card { background:rgba(22,26,45,0.92); border:1px solid var(--border); border-radius:1.15rem; box-shadow:var(--shadow); padding:1rem; display:flex; flex-direction:column; gap:0.9rem; }
    .zone-head { display:flex; justify-content:space-between; gap:0.75rem; align-items:center; }
    .zone-left { display:flex; gap:0.75rem; align-items:center; min-width:0; flex:1; }
    .icon-btn { width:2.5rem; height:2.5rem; border-radius:0.9rem; border:1px solid var(--border); background:var(--surface-alt); color:var(--text); display:grid; place-items:center; font-size:1.4rem; }
    .zone-name-input { flex:1; min-width:0; background:transparent; border:none; color:var(--text); font-size:1.2rem; font-weight:700; }
    .power-button { width:2.7rem; height:2.7rem; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); font-size:1.1rem; line-height:1; flex:0 0 auto; }
    .power-on { background:var(--accent); color:white; box-shadow:0 0 0 2px rgba(124,115,255,0.22); border-color:transparent; }
    .power-off { background:var(--surface-alt); color:var(--text-muted); }
    .source-select, .timer-select { width:100%; background:var(--surface-alt); color:var(--text); border:1px solid var(--border); border-radius:0.8rem; padding:0.8rem 0.9rem; }
    .volume-wrap { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:0.75rem; color:var(--text-muted); }
    .volume-wrap input[type="range"] { width:100%; accent-color:var(--accent); }
    .status-text { font-size:0.95rem; color:var(--text-muted); }
    .autooff-panel { border:1px solid var(--border); background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); border-radius:1rem; padding:0.8rem; display:flex; flex-direction:column; gap:0.75rem; }
    .row-between { display:flex; justify-content:space-between; align-items:center; gap:0.75rem; }
    .small-label { font-size:0.86rem; color:var(--text-muted); }
    .chip { display:inline-flex; align-items:center; gap:0.25rem; padding:0.15rem 0.45rem; border-radius:999px; font-size:0.76rem; font-weight:700; }
    .chip-on { background:rgba(255,205,60,0.15); color:#f3c455; }
    .chip-off { background:rgba(255,255,255,0.04); color:var(--text-muted); }
    .toggle { width:3.2rem; height:1.9rem; border-radius:999px; padding:0.18rem; border:1px solid var(--border); background:var(--surface-alt); display:flex; align-items:center; transition:background var(--transition); }
    .toggle-thumb { width:1.45rem; height:1.45rem; border-radius:50%; background:#d9d9e7; transition:transform var(--transition), background var(--transition); }
    .toggle.on { background:var(--accent-soft); }
    .toggle.on .toggle-thumb { transform:translateX(1.2rem); background:var(--accent); }
    .advanced-button { align-self:flex-end; border:1px solid var(--border); background:var(--surface-alt); color:var(--text-muted); border-radius:0.8rem; padding:0.45rem 0.7rem; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:center; justify-content:center; z-index:100; padding:1rem; }
    .modal { width:min(100%,520px); max-height:90vh; overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:1rem; padding:1rem; box-shadow:var(--shadow); }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
    .close-btn { width:2.3rem; height:2.3rem; border-radius:999px; border:1px solid var(--border); background:var(--surface-alt); color:var(--text); }
    .field-stack { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:1rem; }
    .slider-row { display:flex; flex-direction:column; gap:0.4rem; margin-bottom:0.9rem; }
    .slider-row input[type="range"] { width:100%; accent-color:var(--accent); }
    .emoji-pop { position:absolute; z-index:120; background:var(--surface); border:1px solid var(--border); border-radius:1rem; padding:0.6rem; display:grid; grid-template-columns:repeat(6,1fr); gap:0.35rem; box-shadow:var(--shadow); }
    .emoji-choice { width:2.2rem; height:2.2rem; border-radius:0.7rem; border:1px solid var(--border); background:var(--surface-alt); }
  </style>
</head>
<body>
  <div class="app">
    <div class="serial-banner" id="serialBanner"></div>
    <header class="header">
      <div class="title"><span class="title-icon">♫</span><span>Home<br>Audio</span></div>
      <div class="header-actions">
        <button class="pill-btn" id="sourcesButton">🎛️ Sources</button>
        <button class="pill-btn theme-toggle" id="themeToggle" aria-label="Toggle theme">🌞</button>
      </div>
    </header>
    <main>
      <div class="grid" id="zonesGrid"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="sourcesModalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <strong>Source Names</strong>
        <button class="close-btn" id="sourcesClose" type="button">✕</button>
      </div>
      <div id="sourcesForm"></div>
      <button class="pill-btn" id="sourcesSave" type="button">Save</button>
    </div>
  </div>

  <div class="modal-backdrop" id="advancedModalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <strong id="advancedTitle">Advanced</strong>
        <button class="close-btn" id="advancedClose" type="button">✕</button>
      </div>
      <div class="field-stack">
        <label class="row-between"><span>Mute</span><button class="toggle" id="advancedMuteToggle" type="button"><span class="toggle-thumb"></span></button></label>
      </div>
      <div class="slider-row">
        <div class="row-between"><span>Max volume</span><span id="advancedMaxVolumeValue">38</span></div>
        <input type="range" min="0" max="38" id="advancedMaxVolumeRange">
      </div>
      <div class="slider-row">
        <div class="row-between"><span>Bass</span><span id="advancedBassValue">0</span></div>
        <input type="range" min="0" max="14" id="advancedBassRange">
      </div>
      <div class="slider-row">
        <div class="row-between"><span>Treble</span><span id="advancedTrebleValue">0</span></div>
        <input type="range" min="0" max="14" id="advancedTrebleRange">
      </div>
      <div class="slider-row">
        <div class="row-between"><span>Balance</span><span id="advancedBalanceValue">Center</span></div>
        <input type="range" min="0" max="20" id="advancedBalanceRange">
      </div>
    </div>
  </div>

  <script>
    let cfg = null;
    const zoneState = {};
    const volumeDebouncers = {};
    let currentTheme = 'dark';
    let advancedZone = null;

    const zonesGrid = document.getElementById('zonesGrid');
    const serialBanner = document.getElementById('serialBanner');
    const themeToggle = document.getElementById('themeToggle');
    const sourcesButton = document.getElementById('sourcesButton');
    const sourcesModalBackdrop = document.getElementById('sourcesModalBackdrop');
    const sourcesClose = document.getElementById('sourcesClose');
    const sourcesForm = document.getElementById('sourcesForm');
    const sourcesSave = document.getElementById('sourcesSave');
    const advancedModalBackdrop = document.getElementById('advancedModalBackdrop');
    const advancedTitle = document.getElementById('advancedTitle');
    const advancedClose = document.getElementById('advancedClose');
    const advancedMuteToggle = document.getElementById('advancedMuteToggle');
    const advancedMaxVolumeRange = document.getElementById('advancedMaxVolumeRange');
    const advancedMaxVolumeValue = document.getElementById('advancedMaxVolumeValue');
    const advancedBassRange = document.getElementById('advancedBassRange');
    const advancedBassValue = document.getElementById('advancedBassValue');
    const advancedTrebleRange = document.getElementById('advancedTrebleRange');
    const advancedTrebleValue = document.getElementById('advancedTrebleValue');
    const advancedBalanceRange = document.getElementById('advancedBalanceRange');
    const advancedBalanceValue = document.getElementById('advancedBalanceValue');

    const emojiList = ['🍳','🧺','🚗','🛏️','🛁','🌿','🏠','🎧','🎵','📺','🍽️','🌙','🌤️','🎉','🏡','📻','🔊','🔈'];
    const timerChoices = [30, 60, 90, 120, 180, 240];

    function escapeHtml(str) {
      return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'", '&#39;');
    }

    function ensureAutomationZone(zoneKey) {
      if (!cfg.automation) cfg.automation = { enabled: true, defaultMinutes: 120, zones: {} };
      if (!cfg.automation.zones) cfg.automation.zones = {};
      if (!cfg.automation.zones[zoneKey]) cfg.automation.zones[zoneKey] = { enabled: false, minutes: cfg.automation.defaultMinutes || 120 };
      return cfg.automation.zones[zoneKey];
    }

    async function patchConfig(slice) {
      const res = await fetch('/api/config', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(slice)
      });
      if (!res.ok) throw new Error(await res.text());
      cfg = await res.json();
      renderZones();
      return cfg;
    }

    async function loadConfig() {
      const res = await fetch('/api/config');
      if (!res.ok) throw new Error(await res.text());
      cfg = await res.json();
    }

    async function refreshSerialStatus() {
      try {
        const res = await fetch('/api/serial-status');
        if (!res.ok) throw new Error('status unavailable');
        const json = await res.json();
        if (json.online) {
          serialBanner.style.display = 'none';
        } else {
          serialBanner.style.display = 'block';
          serialBanner.innerHTML = `⚠️ <strong>Serial offline</strong> – commands will fail. Path: ${escapeHtml(json.path || 'unknown')}`;
        }
      } catch {
        serialBanner.style.display = 'block';
        serialBanner.innerHTML = '⚠️ <strong>Serial status unavailable</strong>';
      }
    }

    async function loadZoneState(zone) {
      try {
        const res = await fetch(`/api/state?zone=${zone}`);
        if (!res.ok) throw new Error(await res.text());
        zoneState[String(zone)] = await res.json();
      } catch (err) {
        console.error('State load failed for zone', zone, err);
      }
      applyZoneState(String(zone));
    }

    async function loadAllZoneStateStaggered() {
      for (let z = 1; z <= 6; z++) {
        setTimeout(() => loadZoneState(z), (z - 1) * 200);
      }
    }

    function applyTheme(theme) {
      currentTheme = theme === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      themeToggle.textContent = currentTheme === 'light' ? '🌞' : '🌙';
    }

    function buildTimerSelect(zoneKey) {
      const select = document.createElement('select');
      select.className = 'timer-select';
      const automation = ensureAutomationZone(zoneKey);
      timerChoices.forEach((minutes) => {
        const option = document.createElement('option');
        option.value = String(minutes);
        option.textContent = `${minutes} min`;
        if (Number(automation.minutes) === minutes) option.selected = true;
        select.appendChild(option);
      });
      select.addEventListener('change', async () => {
        const minutes = parseInt(select.value, 10) || 120;
        automation.minutes = minutes;
        await patchConfig({ automation: { zones: { [zoneKey]: { minutes } } } });
      });
      return select;
    }

    function renderZones() {
      if (!cfg) return;
      zonesGrid.innerHTML = '';

      for (let z = 1; z <= 6; z++) {
        const zoneKey = String(z);
        const zoneCfg = cfg.zones?.[zoneKey] || {};
        const state = zoneState[zoneKey] || { power: false, source: 1, volume: 0, mute: false, bass: 0, treble: 0, balance: 10 };
        const automation = ensureAutomationZone(zoneKey);

        const card = document.createElement('section');
        card.className = 'zone-card';
        card.dataset.zone = zoneKey;

        const head = document.createElement('div');
        head.className = 'zone-head';

        const zoneLeft = document.createElement('div');
        zoneLeft.className = 'zone-left';

        const iconBtn = document.createElement('button');
        iconBtn.type = 'button';
        iconBtn.className = 'icon-btn';
        iconBtn.textContent = zoneCfg.icon || '🎧';
        iconBtn.addEventListener('click', () => openEmojiPicker(zoneKey, iconBtn));

        const zoneNameInput = document.createElement('input');
        zoneNameInput.className = 'zone-name-input';
        zoneNameInput.value = zoneCfg.name || `Zone ${zoneKey}`;
        zoneNameInput.addEventListener('blur', async () => {
          const name = zoneNameInput.value.trim() || `Zone ${zoneKey}`;
          cfg.zones[zoneKey] = cfg.zones[zoneKey] || {};
          cfg.zones[zoneKey].name = name;
          await patchConfig({ zones: { [zoneKey]: { name } } });
        });
        zoneNameInput.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') zoneNameInput.blur(); });

        zoneLeft.append(iconBtn, zoneNameInput);

        const powerBtn = document.createElement('button');
        powerBtn.type = 'button';
        powerBtn.className = `power-button ${state.power ? 'power-on' : 'power-off'}`;
        powerBtn.textContent = '⏻';
        powerBtn.addEventListener('click', async () => {
          const next = !Boolean(zoneState[zoneKey]?.power);
          const res = await fetch(`/api/zone/${zoneKey}/power`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ on: next })
          });
          if (!res.ok) return console.error(await res.text());
          zoneState[zoneKey] = zoneState[zoneKey] || {};
          zoneState[zoneKey].power = next;
          applyZoneState(zoneKey);
        });

        head.append(zoneLeft, powerBtn);
        card.appendChild(head);

        const sourceSelect = document.createElement('select');
        sourceSelect.className = 'source-select';
        for (let s = 1; s <= 6; s++) {
          const option = document.createElement('option');
          option.value = String(s);
          option.textContent = cfg.sourceNames?.[String(s)] || `Source ${s}`;
          if (Number(state.source) === s) option.selected = true;
          sourceSelect.appendChild(option);
        }
        sourceSelect.addEventListener('change', async () => {
          const source = parseInt(sourceSelect.value, 10);
          const res = await fetch(`/api/zone/${zoneKey}/source`, {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ source })
          });
          if (!res.ok) return console.error(await res.text());
          zoneState[zoneKey] = zoneState[zoneKey] || {};
          zoneState[zoneKey].source = source;
          applyZoneState(zoneKey);
        });
        card.appendChild(sourceSelect);

        const volumeWrap = document.createElement('div');
        volumeWrap.className = 'volume-wrap';
        const muteIcon = document.createElement('span');
        muteIcon.textContent = state.mute ? '🔇' : '🔈';
        const volumeRange = document.createElement('input');
        volumeRange.type = 'range';
        volumeRange.min = '0';
        volumeRange.max = String(zoneCfg.maxVolume ?? 38);
        volumeRange.value = String(state.volume ?? 0);
        const volumeText = document.createElement('span');
        volumeText.textContent = String(state.volume ?? 0);
        volumeRange.addEventListener('input', () => {
          const value = parseInt(volumeRange.value, 10) || 0;
          volumeText.textContent = String(value);
          zoneState[zoneKey] = zoneState[zoneKey] || {};
          zoneState[zoneKey].volume = value;
          if (volumeDebouncers[zoneKey]) clearTimeout(volumeDebouncers[zoneKey]);
          volumeDebouncers[zoneKey] = setTimeout(async () => {
            const res = await fetch(`/api/zone/${zoneKey}/volume`, {
              method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ volume:value })
            });
            if (!res.ok) return console.error(await res.text());
          }, 300);
        });
        volumeWrap.append(muteIcon, volumeRange, volumeText);
        card.appendChild(volumeWrap);

        const statusText = document.createElement('div');
        statusText.className = 'status-text';
        statusText.textContent = state.power ? `▶ ${cfg.sourceNames?.[String(state.source)] || `Source ${state.source}`}` : 'Off';
        card.appendChild(statusText);

        const autoPanel = document.createElement('div');
        autoPanel.className = 'autooff-panel';

        const autoRow = document.createElement('div');
        autoRow.className = 'row-between';
        const autoLabel = document.createElement('div');
        autoLabel.className = 'small-label';
        autoLabel.textContent = 'Auto-off';
        const rightWrap = document.createElement('div');
        rightWrap.style.display = 'flex';
        rightWrap.style.alignItems = 'center';
        rightWrap.style.gap = '0.5rem';

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = `toggle ${automation.enabled ? 'on' : ''}`;
        toggle.innerHTML = '<span class="toggle-thumb"></span>';

        const stateChip = document.createElement('span');
        stateChip.className = `chip ${automation.enabled ? 'chip-on' : 'chip-off'}`;
        stateChip.textContent = automation.enabled ? 'Enabled' : 'Disabled';

        toggle.addEventListener('click', async () => {
          const enabled = !ensureAutomationZone(zoneKey).enabled;
          ensureAutomationZone(zoneKey).enabled = enabled;
          await patchConfig({ automation: { zones: { [zoneKey]: { enabled } } } });
        });

        rightWrap.append(toggle, stateChip);
        autoRow.append(autoLabel, rightWrap);

        const timerRow = document.createElement('div');
        timerRow.className = 'row-between';
        const timerLabel = document.createElement('div');
        timerLabel.className = 'small-label';
        timerLabel.textContent = 'Timer';
        const timerSelect = buildTimerSelect(zoneKey);
        timerSelect.style.maxWidth = '9rem';
        timerRow.append(timerLabel, timerSelect);

        autoPanel.append(autoRow, timerRow);
        card.appendChild(autoPanel);

        const advancedBtn = document.createElement('button');
        advancedBtn.type = 'button';
        advancedBtn.className = 'advanced-button';
        advancedBtn.textContent = 'Advanced';
        advancedBtn.addEventListener('click', () => openAdvanced(zoneKey));
        card.appendChild(advancedBtn);

        zonesGrid.appendChild(card);
      }
    }

    function applyZoneState(zoneKey) {
      const card = zonesGrid.querySelector(`[data-zone="${zoneKey}"]`);
      if (!card) return;
      const state = zoneState[zoneKey] || {};
      const zoneCfg = cfg.zones?.[zoneKey] || {};
      const powerBtn = card.querySelector('.power-button');
      const sourceSelect = card.querySelector('.source-select');
      const range = card.querySelector('.volume-wrap input[type="range"]');
      const volumeText = card.querySelector('.volume-wrap span:last-child');
      const muteIcon = card.querySelector('.volume-wrap span:first-child');
      const statusText = card.querySelector('.status-text');
      if (powerBtn) powerBtn.className = `power-button ${state.power ? 'power-on' : 'power-off'}`;
      if (sourceSelect && state.source != null) sourceSelect.value = String(state.source);
      if (range) { range.max = String(zoneCfg.maxVolume ?? 38); range.value = String(state.volume ?? 0); }
      if (volumeText) volumeText.textContent = String(state.volume ?? 0);
      if (muteIcon) muteIcon.textContent = state.mute ? '🔇' : '🔈';
      if (statusText) statusText.textContent = state.power ? `▶ ${cfg.sourceNames?.[String(state.source)] || `Source ${state.source}`}` : 'Off';
    }

    function openEmojiPicker(zoneKey, anchor) {
      const pop = document.createElement('div');
      pop.className = 'emoji-pop';
      emojiList.forEach((emoji) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'emoji-choice';
        btn.textContent = emoji;
        btn.addEventListener('click', async () => {
          cfg.zones[zoneKey] = cfg.zones[zoneKey] || {};
          cfg.zones[zoneKey].icon = emoji;
          await patchConfig({ zones: { [zoneKey]: { icon: emoji } } });
          document.body.removeChild(pop);
        });
        pop.appendChild(btn);
      });
      const rect = anchor.getBoundingClientRect();
      pop.style.top = `${rect.bottom + window.scrollY + 4}px`;
      pop.style.left = `${rect.left + window.scrollX}px`;
      document.body.appendChild(pop);
      const close = (ev) => {
        if (!pop.contains(ev.target) && ev.target !== anchor) {
          if (document.body.contains(pop)) document.body.removeChild(pop);
          document.removeEventListener('click', close);
        }
      };
      setTimeout(() => document.addEventListener('click', close), 0);
    }

    function openAdvanced(zoneKey) {
      advancedZone = zoneKey;
      const zoneCfg = cfg.zones?.[zoneKey] || {};
      const state = zoneState[zoneKey] || { mute:false, bass:0, treble:0, balance:10 };
      advancedTitle.textContent = `Advanced – ${zoneCfg.name || `Zone ${zoneKey}`}`;
      advancedMuteToggle.className = `toggle ${state.mute ? 'on' : ''}`;
      advancedMuteToggle.innerHTML = '<span class="toggle-thumb"></span>';
      advancedMaxVolumeRange.value = String(zoneCfg.maxVolume ?? 38);
      advancedMaxVolumeValue.textContent = String(zoneCfg.maxVolume ?? 38);
      advancedBassRange.value = String(state.bass ?? 0);
      advancedBassValue.textContent = String(state.bass ?? 0);
      advancedTrebleRange.value = String(state.treble ?? 0);
      advancedTrebleValue.textContent = String(state.treble ?? 0);
      advancedBalanceRange.value = String(state.balance ?? 10);
      advancedBalanceValue.textContent = balanceLabel(state.balance ?? 10);
      advancedModalBackdrop.style.display = 'flex';
    }

    function balanceLabel(v) { if (v < 8) return 'Left'; if (v > 12) return 'Right'; return 'Center'; }

    sourcesButton.addEventListener('click', () => {
      sourcesForm.innerHTML = '';
      for (let s = 1; s <= 6; s++) {
        const wrap = document.createElement('div');
        wrap.className = 'field-stack';
        const label = document.createElement('label');
        label.textContent = `Source ${s}`;
        const input = document.createElement('input');
        input.value = cfg.sourceNames?.[String(s)] || `Source ${s}`;
        input.dataset.source = String(s);
        input.style.padding = '0.75rem';
        input.style.borderRadius = '0.8rem';
        input.style.border = '1px solid var(--border)';
        input.style.background = 'var(--surface-alt)';
        input.style.color = 'var(--text)';
        wrap.append(label, input);
        sourcesForm.appendChild(wrap);
      }
      sourcesModalBackdrop.style.display = 'flex';
    });

    sourcesClose.addEventListener('click', () => { sourcesModalBackdrop.style.display = 'none'; });
    sourcesSave.addEventListener('click', async () => {
      const sourceNames = {};
      sourcesForm.querySelectorAll('input[data-source]').forEach((input) => {
        sourceNames[input.dataset.source] = input.value.trim() || `Source ${input.dataset.source}`;
      });
      await patchConfig({ sourceNames });
      sourcesModalBackdrop.style.display = 'none';
    });

    themeToggle.addEventListener('click', async () => {
      const next = currentTheme === 'dark' ? 'light' : 'dark';
      cfg.theme = next;
      applyTheme(next);
      await patchConfig({ theme: next });
    });

    advancedClose.addEventListener('click', () => {
      advancedZone = null;
      advancedModalBackdrop.style.display = 'none';
    });

    advancedMuteToggle.addEventListener('click', async () => {
      if (!advancedZone) return;
      const mute = !advancedMuteToggle.classList.contains('on');
      const res = await fetch(`/api/zone/${advancedZone}/mute`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ mute })
      });
      if (!res.ok) return console.error(await res.text());
      zoneState[advancedZone] = zoneState[advancedZone] || {};
      zoneState[advancedZone].mute = mute;
      advancedMuteToggle.className = `toggle ${mute ? 'on' : ''}`;
      advancedMuteToggle.innerHTML = '<span class="toggle-thumb"></span>';
      applyZoneState(advancedZone);
    });

    advancedMaxVolumeRange.addEventListener('input', () => { advancedMaxVolumeValue.textContent = advancedMaxVolumeRange.value; });
    advancedMaxVolumeRange.addEventListener('change', async () => {
      if (!advancedZone) return;
      const maxVolume = parseInt(advancedMaxVolumeRange.value, 10) || 38;
      await patchConfig({ zones: { [advancedZone]: { maxVolume } } });
      applyZoneState(advancedZone);
    });

    advancedBassRange.addEventListener('input', () => { advancedBassValue.textContent = advancedBassRange.value; });
    advancedBassRange.addEventListener('change', async () => {
      if (!advancedZone) return;
      const bass = parseInt(advancedBassRange.value, 10) || 0;
      const res = await fetch(`/api/zone/${advancedZone}/bass`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ bass }) });
      if (!res.ok) return console.error(await res.text());
      zoneState[advancedZone] = zoneState[advancedZone] || {}; zoneState[advancedZone].bass = bass;
    });

    advancedTrebleRange.addEventListener('input', () => { advancedTrebleValue.textContent = advancedTrebleRange.value; });
    advancedTrebleRange.addEventListener('change', async () => {
      if (!advancedZone) return;
      const treble = parseInt(advancedTrebleRange.value, 10) || 0;
      const res = await fetch(`/api/zone/${advancedZone}/treble`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ treble }) });
      if (!res.ok) return console.error(await res.text());
      zoneState[advancedZone] = zoneState[advancedZone] || {}; zoneState[advancedZone].treble = treble;
    });

    advancedBalanceRange.addEventListener('input', () => { advancedBalanceValue.textContent = balanceLabel(parseInt(advancedBalanceRange.value, 10) || 10); });
    advancedBalanceRange.addEventListener('change', async () => {
      if (!advancedZone) return;
      const balance = parseInt(advancedBalanceRange.value, 10) || 10;
      const res = await fetch(`/api/zone/${advancedZone}/balance`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ balance }) });
      if (!res.ok) return console.error(await res.text());
      zoneState[advancedZone] = zoneState[advancedZone] || {}; zoneState[advancedZone].balance = balance;
      advancedBalanceValue.textContent = balanceLabel(balance);
    });

    async function bootstrap() {
      try {
        await Promise.all([loadConfig(), refreshSerialStatus()]);
        applyTheme(cfg.theme || 'dark');
        renderZones();
        await loadAllZoneStateStaggered();
        setInterval(() => loadConfig().then(() => renderZones()).catch(console.error), 60000);
        setInterval(loadAllZoneStateStaggered, 30000);
        setInterval(refreshSerialStatus, 5000);
      } catch (err) {
        console.error('Bootstrap failed', err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  </script>
</body>
</html>
