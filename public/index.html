<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Monoprice 10761 Controller</title>
  <style>
    :root {
      --bg:#171614;--surface:#1c1b19;--surface2:#22211f;--text:#ece8df;--muted:#aaa49b;--border:rgba(255,255,255,.1);--primary:#4f98a3;--danger:#d163a7;
    }
    [data-theme="light"] { --bg:#f7f6f2;--surface:#fbfbf9;--surface2:#f1eeea;--text:#28251d;--muted:#6f6a62;--border:rgba(40,37,29,.12);--primary:#01696f;--danger:#a12c7b; }
    *{box-sizing:border-box} body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),transparent);display:grid;place-items:center;border:1px solid var(--border)}
    .wrap{max-width:1200px;margin:0 auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:1.1rem;font-weight:700}.muted{color:var(--muted)}
    button,select,input{font:inherit} button,select{min-height:44px}.iconbtn,.power{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
    .power.on{background:color-mix(in srgb,var(--primary) 22%,var(--surface2));border-color:color-mix(in srgb,var(--primary) 50%,var(--border))}
    .power svg{width:21px;height:21px;stroke:currentColor;pointer-events:none}
    .icon-chip{font-size:1.3rem}.stack{display:grid;gap:12px}.kv{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.slider{width:100%}
    .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);border-radius:18px 18px 0 0;padding:16px;transform:translateY(102%);transition:.22s ease;z-index:20}.sheet.open{transform:translateY(0)}
    .emoji-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.emoji-grid button{height:48px;border-radius:14px;border:1px solid var(--border);background:var(--surface2)}
    .banner{display:none;margin:0 0 16px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--danger) 20%,transparent);border:1px solid color-mix(in srgb,var(--danger) 45%,var(--border));color:var(--text)}
    .banner.show{display:block}
    @media (max-width:640px){.wrap{padding:12px}.card{padding:12px}}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">♪</div>
      <div>
        <div class="title">Monoprice 10761</div>
        <div class="muted">6-zone RS-232 controller</div>
      </div>
    </div>
    <button class="iconbtn" id="themeToggle" aria-label="Toggle theme">◐</button>
  </header>
  <main class="wrap">
    <div id="banner" class="banner"></div>
    <section id="zone-grid" class="grid"></section>
  </main>
  <section id="iconSheet" class="sheet" aria-label="Zone icon picker">
    <div class="row" style="margin-bottom:12px"><strong>Choose zone icon</strong><button class="iconbtn" id="closeSheet" aria-label="Close icon picker">✕</button></div>
    <div class="emoji-grid" id="emojiGrid"></div>
  </section>
  <script>
    const icons = ['🍳','🛋️','💻','🛏️','🎵','📺','🌿','🌤️','🔥','🎉','🧘','🍷','🎮','📚','🏖️'];
    const zoneGrid = document.getElementById('zone-grid');
    const banner = document.getElementById('banner');
    const iconSheet = document.getElementById('iconSheet');
    const emojiGrid = document.getElementById('emojiGrid');
    const themeToggle = document.getElementById('themeToggle');
    let config = { zoneNames:{}, zoneIcons:{}, sourceNames:{}, autoOff:{} };
    let zones = [];
    let activeIconZone = null;

    function showError(msg){ banner.textContent = msg; banner.classList.add('show'); }
    function clearError(){ banner.classList.remove('show'); banner.textContent=''; }
    function powerSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"></path><path d="M6.2 6.2a8 8 0 1 0 11.6 0"></path></svg>'; }
    function setTheme(theme){ document.documentElement.setAttribute('data-theme', theme); }
    themeToggle.addEventListener('click',()=>{ const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; setTheme(next); updateConfig({theme:next}); });

    function zoneCard(zone){
      const key = String(zone.zone);
      const el = document.createElement('article');
      el.className = 'card'; el.dataset.zone = key;
      el.innerHTML = `
        <div class="row">
          <div class="row" style="justify-content:flex-start">
            <button class="iconbtn icon-picker" aria-label="Change icon for zone ${key}"><span class="icon-chip">${config.zoneIcons[key] || '🎵'}</span></button>
            <div><div class="title">${config.zoneNames[key] || 'Zone '+key}</div><div class="muted">Source ${zone.source}</div></div>
          </div>
          <button class="power ${zone.power ? 'on' : ''}" data-action="power" aria-label="Power zone ${key}">${powerSvg()}</button>
        </div>
        <div class="stack" style="margin-top:14px">
          <label class="kv"><span>Volume</span><strong class="vol-value">${zone.volume}</strong></label>
          <input class="slider vol" type="range" min="0" max="38" value="${zone.volume}" aria-label="Volume for zone ${key}">
          <label class="kv"><span>Source</span>
            <select class="source" aria-label="Source for zone ${key}">
              ${Array.from({length:6},(_,i)=>`<option value="${i+1}" ${zone.source===i+1?'selected':''}>${config.sourceNames[String(i+1)] || ('Source '+(i+1))}</option>`).join('')}
            </select>
          </label>
          <label class="kv"><span>Auto-off</span><span class="muted">${config.autoOff[key]?.enabled ? config.autoOff[key].minutes+' min' : 'Off'}</span></label>
        </div>`;

      el.querySelector('[data-action="power"]').addEventListener('click', async()=>patchZone(key,{power:!zone.power}));
      el.querySelector('.icon-picker').addEventListener('click',()=>openSheet(key));
      const vol = el.querySelector('.vol');
      vol.addEventListener('input',()=>{ el.querySelector('.vol-value').textContent = vol.value; });
      vol.addEventListener('change', async()=>{ if (Number(vol.value) !== Number(zone.volume)) await patchZone(key,{volume:Number(vol.value)}); });
      el.querySelector('.source').addEventListener('change', async e=>patchZone(key,{source:Number(e.target.value)}));
      return el;
    }

    function renderZones(){ zoneGrid.replaceChildren(...zones.map(zoneCard)); }
    function openSheet(zone){ activeIconZone = String(zone); iconSheet.classList.add('open'); }
    function closeSheet(){ iconSheet.classList.remove('open'); activeIconZone = null; }
    document.getElementById('closeSheet').addEventListener('click', closeSheet);
    icons.forEach(icon=>{
      const btn=document.createElement('button'); btn.textContent=icon; btn.setAttribute('aria-label',`Pick ${icon}`);
      btn.addEventListener('click', async()=>{ if (!activeIconZone) return; const zoneKey=activeIconZone; config.zoneIcons[zoneKey]=icon; await updateConfig({zoneIcons:config.zoneIcons}); renderZones(); closeSheet(); });
      emojiGrid.appendChild(btn);
    });

    async function api(url, options){
      const res = await fetch(url, { headers:{'Content-Type':'application/json'}, ...options });
      const body = await res.json().catch(()=>({}));
      if (!res.ok) throw new Error(body.error || `Request failed: ${res.status}`);
      return body;
    }
    async function updateConfig(patch){ config = await api('/api/config',{method:'PUT',body:JSON.stringify({...config,...patch})}); }
    async function patchZone(zone, patch){ const updated = await api(`/api/zones/${zone}`,{method:'PUT',body:JSON.stringify(patch)}); zones = zones.map(z=>String(z.zone)===String(zone)?updated:z); renderZones(); clearError(); }
    async function boot(){
      try {
        config = await api('/api/config');
        setTheme(config.theme || 'dark');
        const data = await api('/api/zones');
        zones = Array.isArray(data.zones) ? data.zones : [];
        renderZones();
        clearError();
      } catch (err) {
        showError(err.message);
      }
    }
    boot();
    setInterval(boot, 10000);
  </script>
</body>
</html>
